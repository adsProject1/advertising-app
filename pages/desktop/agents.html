<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agents — PromoTrack</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/desktop.css">
</head>
<body class="desktop-app">
<div id="shell-header"></div>
<div class="app-body">
  <div id="shell-sidebar"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Agents</h1>
        <div class="subtitle">Field agents available for activity assignment.</div>
      </div>
    </div>

    <div class="filters-bar">
      <input type="text" class="form-control search-input" id="filter-search" placeholder="Search agents by name or mobile...">
      <select class="form-control" id="filter-status"></select>
    </div>

    <div class="table-wrap card" id="agents-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>Agent</th><th>Mobile</th><th class="num">Assigned Activities</th><th class="num">Active Tasks</th><th>Status</th><th></th>
        </tr></thead>
        <tbody id="agents-tbody"></tbody>
      </table>
    </div>
    <div class="card" id="agents-empty" style="display:none;"></div>
  </main>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/desktop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initShell('agents');
  initAgentsPage();
});
</script>
</body>
</html>
