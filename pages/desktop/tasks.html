<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — PromoTrack</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/desktop.css">
</head>
<body class="desktop-app">
<div id="shell-header"></div>
<div class="app-body">
  <div id="shell-sidebar"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Tasks</h1>
        <div class="subtitle">Field execution units performed by agents within an activity.</div>
      </div>
      <div class="page-header-actions">
        <a class="btn btn-primary" href="task-create.html">+ Create Task</a>
      </div>
    </div>

    <div class="filters-bar">
      <input type="text" class="form-control search-input" id="filter-search" placeholder="Search tasks...">
      <select class="form-control" id="filter-activity"></select>
      <select class="form-control" id="filter-type"></select>
      <select class="form-control" id="filter-status"></select>
    </div>

    <div class="table-wrap card" id="tasks-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>Task No.</th><th>Activity</th><th>Task Name</th><th>Type</th><th>Schedule</th><th class="num">Assigned Agents</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="tasks-tbody"></tbody>
      </table>
    </div>
    <div class="card" id="tasks-empty" style="display:none;"></div>
  </main>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/desktop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initShell('tasks');
  initTasksListPage();
});
</script>
</body>
</html>
