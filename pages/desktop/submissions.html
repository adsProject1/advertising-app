<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submissions — PromoTrack</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/desktop.css">
</head>
<body class="desktop-app">
<div id="shell-header"></div>
<div class="app-body">
  <div id="shell-sidebar"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Submissions</h1>
        <div class="subtitle">Field evidence submitted by agents, for review and approval.</div>
      </div>
    </div>

    <div class="filters-bar">
      <input type="text" class="form-control search-input" id="filter-search" placeholder="Search by task, agent or submission ID...">
      <select class="form-control" id="filter-activity"></select>
      <select class="form-control" id="filter-status"></select>
      <select class="form-control" id="filter-agent"></select>
    </div>

    <div class="table-wrap card" id="submissions-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>Submission</th><th>Agent</th><th>Activity</th><th>Task</th><th>Submitted At</th><th>Location</th><th>Status</th><th></th>
        </tr></thead>
        <tbody id="submissions-tbody"></tbody>
      </table>
    </div>
    <div class="card" id="submissions-empty" style="display:none;"></div>
  </main>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/desktop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initShell('submissions');
  initSubmissionsPage();
});
</script>
</body>
</html>
