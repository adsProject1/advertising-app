<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Activity — PromoTrack</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/desktop.css">
</head>
<body class="desktop-app">
<div id="shell-header"></div>
<div class="app-body">
  <div id="shell-sidebar"></div>
  <main class="main-content main-content-narrow">
    <div class="page-header">
      <div>
        <h1 id="page-title">Create Activity</h1>
        <div class="subtitle">An activity always belongs to an event and represents one location-level execution.</div>
      </div>
    </div>

    <div id="activity-form-panel" class="card card-pad">
      <div class="form-section">
        <div class="form-section-title">Activity Information</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Event <span class="req">*</span></label>
            <select class="form-control" id="activity-event"></select>
            <div class="field-error" id="activity-event-error"></div>
          </div>
          <div class="form-group">
            <label>Activity Number</label>
            <input type="text" class="form-control" id="activity-number-display" disabled>
          </div>
          <div class="form-group full">
            <label>Activity Name <span class="req">*</span></label>
            <input type="text" class="form-control" id="activity-name" placeholder="e.g. Phoenix Mall Pune">
            <div class="field-error" id="activity-name-error"></div>
          </div>
          <div class="form-group full">
            <label>Activity Description</label>
            <textarea class="form-control" id="activity-description" placeholder="Brief description of this activity"></textarea>
          </div>
          <div class="form-group">
            <label>Activity Type <span class="req">*</span></label>
            <select class="form-control" id="activity-type"></select>
            <div class="field-error" id="activity-type-error"></div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Location</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Location Name <span class="req">*</span></label>
            <input type="text" class="form-control" id="activity-location-name" placeholder="e.g. Phoenix Marketcity">
            <div class="field-error" id="activity-location-name-error"></div>
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" class="form-control" id="activity-address" placeholder="e.g. Viman Nagar">
          </div>
          <div class="form-group">
            <label>City <span class="req">*</span></label>
            <input type="text" class="form-control" id="activity-city" placeholder="e.g. Pune">
            <div class="field-error" id="activity-city-error"></div>
          </div>
          <div class="form-group">
            <label>State</label>
            <input type="text" class="form-control" id="activity-state" placeholder="e.g. Maharashtra">
          </div>
          <div class="form-group">
            <label>PIN Code</label>
            <input type="text" class="form-control" id="activity-pin" placeholder="e.g. 411014">
          </div>
          <div class="form-group">
            <label>Latitude</label>
            <input type="text" class="form-control" id="activity-lat" placeholder="e.g. 18.5612">
          </div>
          <div class="form-group">
            <label>Longitude</label>
            <input type="text" class="form-control" id="activity-lng" placeholder="e.g. 73.9178">
          </div>
        </div>
        <div id="activity-map-preview"></div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Activity Schedule</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Start Date <span class="req">*</span></label>
            <input type="date" class="form-control" id="activity-start-date">
            <div class="field-error" id="activity-start-date-error"></div>
          </div>
          <div class="form-group">
            <label>End Date <span class="req">*</span></label>
            <input type="date" class="form-control" id="activity-end-date">
            <div class="field-error" id="activity-end-date-error"></div>
          </div>
          <div class="form-group">
            <label>Start Time</label>
            <input type="time" class="form-control" id="activity-start-time">
          </div>
          <div class="form-group">
            <label>End Time</label>
            <input type="time" class="form-control" id="activity-end-time">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Activity Elements</div>
        <div class="element-tiles" id="activity-elements-tiles"></div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Agent Assignment</div>
        <p class="form-hint" style="margin-bottom: var(--sp-3);">Select the field agents who will execute tasks for this activity.</p>
        <div class="agent-picker" id="activity-agent-picker"></div>
        <div class="chip-row" id="activity-agent-chips" style="margin-top: var(--sp-3);"></div>
      </div>

      <div class="form-actions spread">
        <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <div style="display:flex; gap: var(--sp-3);">
          <button class="btn btn-secondary" id="save-draft-btn">Save Draft</button>
          <button class="btn btn-primary" id="create-activity-btn">Create Activity</button>
        </div>
      </div>
    </div>

    <div id="activity-success-panel" class="card" style="display:none;"></div>
  </main>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/desktop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initShell('activities');
  initActivityCreatePage();
});
</script>
</body>
</html>
