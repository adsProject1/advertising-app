<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Activity — PromoTrack</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/desktop.css">
</head>
<body class="desktop-app">
<div id="shell-header"></div>
<div class="app-body">
  <div id="shell-sidebar"></div>
  <main class="main-content main-content-narrow">
    <div class="page-header">
      <div>
        <h1 id="page-title">Add Activity</h1>
        <div class="subtitle">An activity is the single unit of field execution.</div>
      </div>
    </div>

    <div id="activity-form-panel" class="card card-pad">
      <div class="form-section">
        <div class="form-section-title">Activity Information</div>
        <div class="form-grid">
          <div class="form-group">
            <label>State Name <span class="req">*</span></label>
            <select class="form-control" id="activity-state"></select>
            <div class="field-error" id="activity-state-error"></div>
          </div>
          <div class="form-group">
            <label>AO Name <span class="req">*</span></label>
            <select class="form-control" id="activity-ao"></select>
            <div class="field-error" id="activity-ao-error"></div>
          </div>
          <div class="form-group full">
            <label>Activity Name <span class="req">*</span></label>
            <input type="text" class="form-control" id="activity-name" placeholder="e.g. Phoenix Mall Pune">
            <div class="field-error" id="activity-name-error"></div>
          </div>
          <div class="form-group">
            <label>Period From <span class="req">*</span></label>
            <input type="date" class="form-control" id="activity-period-from">
            <div class="field-error" id="activity-period-from-error"></div>
          </div>
          <div class="form-group">
            <label>Period To <span class="req">*</span></label>
            <input type="date" class="form-control" id="activity-period-to">
            <div class="field-error" id="activity-period-to-error"></div>
          </div>
          <div class="form-group">
            <label>Number of Team/Vans <span class="req">*</span></label>
            <input type="number" min="1" class="form-control" id="activity-teamvan" placeholder="e.g. 2">
            <div class="field-error" id="activity-teamvan-error"></div>
          </div>
        </div>
      </div>

      <div class="form-section" id="team-locations-section" style="display:none;">
        <div class="form-section-title">Team / Van Locations <span class="req">*</span></div>
        <p class="form-hint" style="margin-bottom: var(--sp-3);">Enter a location for each team/van &mdash; the next box appears once the current one is filled.</p>
        <div class="form-grid" id="team-locations-list"></div>
        <div class="field-error" id="team-locations-error"></div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Element Name <span class="req">*</span></div>
        <div class="tag-list" id="activity-elements-selected" style="margin-bottom: var(--sp-3);"></div>
        <div class="element-search-wrap" id="element-search-wrap">
          <input type="text" class="form-control" id="element-search-input" placeholder="Search elements (English or Hindi)..." autocomplete="off">
          <div class="element-search-dropdown" id="element-search-dropdown" style="display:none;"></div>
        </div>
        <div class="field-error" id="activity-elements-error"></div>
      </div>

      <div class="form-actions spread">
        <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="create-activity-btn">Create Activity</button>
      </div>
    </div>

    <div id="activity-success-panel" class="card" style="display:none;"></div>
  </main>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/desktop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initShell('activities');
  initActivityCreatePage();
});
</script>
</body>
</html>
