<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activities — PromoTrack</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/desktop.css">
</head>
<body class="desktop-app">
<div id="shell-header"></div>
<div class="app-body">
  <div id="shell-sidebar"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Activities</h1>
        <div class="subtitle">All field promotion activities.</div>
      </div>
      <div class="page-header-actions">
        <a class="btn btn-primary" href="activity-create.html">+ Add Activity</a>
      </div>
    </div>

    <div class="card list-panel">
      <div class="filters-bar">
        <input type="text" class="form-control search-input" id="filter-search" placeholder="Search activities...">
        <select class="form-control" id="filter-state"></select>
        <select class="form-control" id="filter-ao"></select>
      </div>

      <div class="table-wrap" id="activities-table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>Activity No.</th><th>State Name</th><th>AO Name</th><th>Activity Name</th><th>Period</th><th>No. of Team/Vans</th><th>Actions</th>
          </tr></thead>
          <tbody id="activities-tbody"></tbody>
        </table>
      </div>
      <div id="activities-empty" style="display:none;"></div>
    </div>
  </main>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/desktop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initShell('activities');
  initActivitiesListPage();
});
</script>
</body>
</html>
