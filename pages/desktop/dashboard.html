<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — PromoTrack</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/desktop.css">
</head>
<body class="desktop-app">
<div id="shell-header"></div>
<div class="app-body">
  <div id="shell-sidebar"></div>
  <main class="main-content">
    <div class="stat-panel">
      <div class="page-header">
        <div>
          <h1>Dashboard</h1>
          <div class="subtitle">Overview of all activities and field execution.</div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-card stat-card-clickable" id="stat-card-all" onclick="setDashboardFilter('all')"><div class="stat-icon">&#128205;</div><div class="stat-body"><div class="stat-label">Total Activities</div><div class="stat-value" id="stat-total-activities">0</div></div></div>
        <div class="stat-card stat-card-clickable" id="stat-card-ongoing" onclick="setDashboardFilter('ongoing')"><div class="stat-icon">&#9889;</div><div class="stat-body"><div class="stat-label">Ongoing Activities</div><div class="stat-value" id="stat-ongoing-activities">0</div></div></div>
        <div class="stat-card stat-card-clickable" id="stat-card-submissions" onclick="setDashboardFilter('submissions')"><div class="stat-icon">&#128247;</div><div class="stat-body"><div class="stat-label">Total Submissions</div><div class="stat-value" id="stat-total-submissions">0</div></div></div>
        <div class="stat-card stat-card-clickable" id="stat-card-completed" onclick="setDashboardFilter('completed')"><div class="stat-icon">&#9989;</div><div class="stat-body"><div class="stat-label">Completed Activities</div><div class="stat-value" id="stat-completed-activities">0</div></div></div>
      </div>
    </div>

    <div class="card" style="margin-top: var(--sp-6);">
      <div class="card-header"><h3 id="dashboard-activities-title">Recent Activities</h3></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>Activity</th><th>State</th><th>AO Name</th><th>Period</th><th class="num">Submissions</th><th>Status</th>
          </tr></thead>
          <tbody id="dashboard-activities-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top: var(--sp-5);">
      <div class="card-header"><h3>Today's Activities</h3></div>
      <div id="today-activities-list"></div>
    </div>
  </main>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/desktop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initShell('dashboard');
  initDashboardPage();
});
</script>
</body>
</html>
