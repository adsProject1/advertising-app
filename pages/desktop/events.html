<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — PromoTrack</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/desktop.css">
</head>
<body class="desktop-app">
<div id="shell-header"></div>
<div class="app-body">
  <div id="shell-sidebar"></div>
  <main class="main-content">
    <div class="stat-panel">
      <div class="page-header">
        <div>
          <h1>Events</h1>
          <div class="subtitle">Manage promotional events and campaigns.</div>
        </div>
        <div class="page-header-actions">
          <a class="btn btn-primary" href="event-create.html">+ Create Event</a>
        </div>
      </div>

      <div class="stat-grid stat-grid-filters" id="events-stat-cards"></div>
    </div>

    <div class="card list-panel">
      <div class="filters-bar">
        <input type="text" class="form-control search-input" id="filter-search" placeholder="Search events...">
        <select class="form-control" id="filter-status"></select>
        <input type="date" class="form-control" id="filter-date-from" title="Date From">
        <input type="date" class="form-control" id="filter-date-to" title="Date To">
      </div>

      <div class="table-wrap" id="events-table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>Event</th><th>Event Number</th><th>Client / Brand</th><th>Date From</th><th>Date To</th><th class="num">Activities</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="events-tbody"></tbody>
        </table>
      </div>
      <div id="events-empty" style="display:none;"></div>
    </div>
  </main>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/desktop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initShell('events');
  initEventsListPage();
});
</script>
</body>
</html>
