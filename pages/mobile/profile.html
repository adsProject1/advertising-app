<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — PromoTrack Agent</title>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/mobile.css">
</head>
<body class="mobile-app">
<div class="mobile-frame">
  <div class="mobile-screen">
    <div class="profile-header">
      <div class="profile-avatar" id="profile-avatar"></div>
      <h2 id="profile-name"></h2>
      <div class="profile-mobile" id="profile-mobile"></div>
      <div class="profile-badges">
        <span class="tag">Field Agent</span>
        <span id="profile-status-badge"></span>
      </div>
    </div>

    <div class="mobile-content">
      <div class="mobile-block">
        <div class="mobile-block-title">Current Activity</div>
        <div class="mobile-kv"><span class="k">Activity</span><span class="v" id="profile-activity-id"></span></div>
        <div class="mobile-kv"><span class="k">Location</span><span class="v" id="profile-activity-location"></span></div>
      </div>
    </div>

    <div class="profile-action-row" id="help-row"><span>Help</span><span class="arrow">&rsaquo;</span></div>
    <div class="profile-action-row danger" id="logout-row"><span>Logout</span><span class="arrow">&rsaquo;</span></div>

    <div style="text-align:center; padding: var(--sp-6);">
      <a href="../../index.html" style="font-size:11.5px; color:var(--color-text-faint); font-weight:600;">&larr; Prototype Switcher</a>
    </div>
  </div>
  <div id="mobile-bottomnav-mount"></div>
</div>

<script src="../../js/mock-data.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/mobile.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initProfilePage();
});
</script>
</body>
</html>
